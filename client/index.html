<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌍</text></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GEOPOLITICS: Global Conquest</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;600;700&family=Inter:wght@300;400;500;600;700&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
              display: ['Chakra Petch', 'sans-serif'],
              tech: ['Rajdhani', 'sans-serif']
            },
            colors: {
              tactical: {
                950: '#060a12',
                900: '#0b1322',
                800: '#142036',
                700: '#1d2f50',
                600: '#2b4474',
                500: '#3b82f6',
                accent: '#06b6d4',
                gold: '#f59e0b',
                danger: '#ef4444',
                success: '#10b981'
              }
            },
            animation: {
              'pulse-slow': 'pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite',
              'radar': 'radar 4s linear infinite',
              'dice-roll': 'diceRoll 0.6s ease-out'
            },
            keyframes: {
              radar: {
                '0%': { transform: 'rotate(0deg)' },
                '100%': { transform: 'rotate(360deg)' }
              },
              diceRoll: {
                '0%': { transform: 'rotate(0deg) scale(0.8)' },
                '50%': { transform: 'rotate(180deg) scale(1.15)' },
                '100%': { transform: 'rotate(360deg) scale(1)' }
              }
            }
          }
        }
      }
    </script>
    <style>
      /* Custom scanline and glow effects */
      .scanline-overlay {
        background: linear-gradient(
          rgba(18, 16, 16, 0) 50%, 
          rgba(0, 0, 0, 0.25) 50%
        ), linear-gradient(
          90deg,
          rgba(255, 0, 0, 0.03),
          rgba(0, 255, 0, 0.01),
          rgba(0, 0, 255, 0.03)
        );
        background-size: 100% 3px, 6px 100%;
        pointer-events: none;
      }
      .neon-glow {
        box-shadow: 0 0 15px rgba(59, 130, 246, 0.4);
      }
      .neon-glow-red {
        box-shadow: 0 0 15px rgba(239, 68, 68, 0.4);
      }
      .custom-scrollbar::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      .custom-scrollbar::-webkit-scrollbar-track {
        background: #0b1322;
      }
      .custom-scrollbar::-webkit-scrollbar-thumb {
        background: #1d2f50;
        border-radius: 3px;
      }
      .custom-scrollbar::-webkit-scrollbar-thumb:hover {
        background: #3b82f6;
      }
    </style>
  </head>
  <body class="bg-tactical-950 text-slate-100 min-h-screen selection:bg-blue-600 selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
